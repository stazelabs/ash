# CI drift gates (ASH-207). Runs the same build/test/lint/regeneration
# checks contributors are expected to run locally, so stale generated
# artifacts (docs/vocab, docs/mcp/tools.json) can't reach `main` unnoticed.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Enforce the no-CGO project constraint: a CGO-bound dep would fail here.
env:
  CGO_ENABLED: "0"

# Least-privilege GITHUB_TOKEN: CI only reads the repo (checkout, build,
# test, drift gates) — no write paths. Set explicitly so CodeQL's
# missing-workflow-permissions check is satisfied (ASH-209 follow-up).
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the git-verb integration tests run `ash git`
          # against this repo, and `show HEAD --stat` needs HEAD's parent
          # commit — absent from a default depth-1 checkout.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # gofmt gate (ASH-220): fail on any unformatted file so formatting
      # drift cannot re-accumulate.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo 'unformatted:'; gofmt -l .; exit 1; }

      - name: test
        run: go test ./...

      # Drift gates — fail when a checked-in generated artifact is stale.
      - name: vocab-check
        run: make vocab-check

      - name: schema-check
        run: make schema-check

      # File-only cl100k-vs-Claude sign-disagreement gate; no API key needed.
      - name: validate-check
        run: make validate-check

      # Release-config gate (ASH-118): validate .goreleaser.yaml and
      # cross-compile all four binaries for every target without
      # publishing. A Go-version bump or dependency drift that breaks
      # the release build fails here, on the PR, not on a tag push.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true
      - name: goreleaser-check
        run: goreleaser check
      - name: goreleaser-build
        run: goreleaser build --snapshot --clean
